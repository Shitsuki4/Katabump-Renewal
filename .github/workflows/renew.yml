name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/workflows/renew.yml"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests pyyaml
          seleniumbase install chromedriver

      # ------------------------------------------------------------------
      # 下载 sing-box（无论是否用代理都需要；auto_proxy.py 也依赖它）
      # ------------------------------------------------------------------
      - name: Download sing-box
        run: |
          SINGBOX_VER="1.13.16"
          echo "Downloading sing-box v${SINGBOX_VER}..."
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      # ------------------------------------------------------------------
      # 自动选节点：有 SUB_URL 时，抓订阅→测活→住宅IP优先→生成 urltest 池 config.json
      # 没配 SUB_URL 但配了 PROXY_URL 时，回退到 proxy_handler.py（单节点）
      # 两者都没配则直连
      # ------------------------------------------------------------------
      - name: Auto-select proxy node (SUB_URL) or fallback (PROXY_URL)
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          POOL_JSON: ${{ secrets.POOL_JSON }}
        run: |
          # 决定 IS_PROXY：SUB_URL 或 PROXY_URL 任一非空即启用代理
          if [ -n "$SUB_URL" ]; then
            echo "USING_AUTO=true" >> "$GITHUB_ENV"
            echo "USING_PROXY=true" >> "$GITHUB_ENV"
            echo "=== Auto mode: SUB_URL set, auto-selecting node ==="
            python auto_proxy.py
          elif [ -n "$PROXY_URL" ]; then
            echo "USING_PROXY=true" >> "$GITHUB_ENV"
            echo "=== Fallback mode: PROXY_URL set, generating single-node config ==="
            python proxy_handler.py
          else
            echo "USING_PROXY=false" >> "$GITHUB_ENV"
            echo "=== Direct mode: no SUB_URL, no PROXY_URL, connecting directly ==="
          fi

      - name: Start Proxy (sing-box)
        env:
          USING_PROXY: ${{ env.USING_PROXY }}
        run: |
          if [ "$USING_PROXY" != "true" ]; then
            echo "Proxy not requested, skipping sing-box startup."
            exit 0
          fi
          if [ ! -f config.json ]; then
            echo "❌ config.json missing — node selection failed"
            exit 1
          fi
          echo "Starting sing-box..."
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          echo "--- waiting for proxy to come up (poll, max 60s) ---"
          ok=0
          for i in $(seq 1 30); do
            if ! pgrep -f "./sing-box" > /dev/null; then
              echo "❌ sing-box process died early"
              tail -30 singbox.log || true
              exit 1
            fi
            if curl -s -m 10 -x http://127.0.0.1:8080 https://api.ip.sb/ip; then
              echo ""
              echo "  <- proxy OK after ~$((i*2))s"
              ok=1
              break
            fi
            sleep 2
          done
          echo "--- singbox.log (last 30 lines) ---"
          tail -30 singbox.log || true
          if [ "$ok" != "1" ]; then
            echo "❌ proxy connect FAILED — no reachable node in pool within 60s"
            exit 1
          fi
          grep -iE "urltest|selected|node-" singbox.log | tail -5 || true

      - name: Run Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          PROXY_SERVER: http://127.0.0.1:8080
          IS_PROXY: ${{ env.USING_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-artifacts
          path: |
            *.png
            screenshots/
            singbox.log
            probe_sb.log
            probe_cfg.json
            config.json
          if-no-files-found: ignore
