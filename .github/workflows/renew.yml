name: Katabump Auto Renew

on:
  schedule:
    # UTC 00:17 / 06:17 / 12:17 / 18:17; avoid the busy top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katabump-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          python -m pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Validate accounts, retry settings and standby syntax
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          FALLBACK_PROXIES: ${{ secrets.FALLBACK_PROXIES }}
          NODE_ATTEMPTS: ${{ secrets.NODE_ATTEMPTS || vars.NODE_ATTEMPTS || '3' }}
          FALLBACK_ATTEMPTS: ${{ vars.FALLBACK_ATTEMPTS || '10' }}
          RUN_BUDGET_SECONDS: ${{ vars.RUN_BUDGET_SECONDS || '2400' }}
        run: python main.py --validate-config

      - name: Download and verify sing-box
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FALLBACK_PROXIES: ${{ secrets.FALLBACK_PROXIES }}
        run: |
          if [ -n "$SUB_URL" ] || [ -n "$PROXY_URL" ] || [ -n "$FALLBACK_PROXIES" ]; then
            python scripts/install_singbox.py
          fi

      - name: Run regression and local proxy integration tests
        run: python -m unittest discover -s tests -v

      - name: Run renewal with automatic failover
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          SUB_URL: ${{ secrets.SUB_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FALLBACK_PROXIES: ${{ secrets.FALLBACK_PROXIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NODE_ATTEMPTS: ${{ secrets.NODE_ATTEMPTS || vars.NODE_ATTEMPTS || '3' }}
          FALLBACK_ATTEMPTS: ${{ vars.FALLBACK_ATTEMPTS || '10' }}
          RUN_BUDGET_SECONDS: ${{ vars.RUN_BUDGET_SECONDS || '2400' }}
        run: |
          umask 077
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Notify workflow failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py --notify-failure

      - name: Upload diagnostic screenshots (opt-in)
        if: ${{ always() && vars.UPLOAD_SCREENSHOTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: renew-screenshots
          retention-days: 1
          path: |
            *.png
            screenshots/
          if-no-files-found: ignore

      - name: Remove generated credential files
        if: always()
        run: rm -f config.json ranked_pool.json probe_cfg.json ip_probe_cfg.json
